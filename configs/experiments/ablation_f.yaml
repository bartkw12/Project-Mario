# Ablation F — 10M steps with best config (forward_scale=0.3 + entropy schedule)
# Base: ablation_d (forward_scale=0.3, ent_coef 0.05→0.02)
# Change: total_timesteps 5M → 10M
# Rationale: Ablation D showed upward trend at 5M (22% flag rate, still climbing).
#   Entropy healthy (-0.61), no policy degradation. More steps should push past 80%.

env:
  game: "SuperMarioBros-1-1-v0"
  movement: "SIMPLE_MOVEMENT"
  frame_skip: 4
  frame_stack: 4
  obs_size: 84
  num_envs: 16

training:
  total_timesteps: 10000000
  lr: 0.00025
  n_steps: 1024
  batch_size: 512
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.05
  ent_coef_final: 0.02

reward:
  forward_scale: 0.3
  death_penalty: -15.0
  flag_bonus: 50.0

eval:
  eval_freq: 100000
  n_eval_episodes: 10
  deterministic: true

seed: 42
device: "auto"
