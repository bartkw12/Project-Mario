# Ablation I — Calibrated target_kl (Ablation G + target_kl=0.05)
# Changes vs ablation_h:
#   - target_kl: 0.015 → 0.05 (calibrated to environment's natural KL)
# Everything else identical to ablation_h/g (reward shaping + entropy schedule).
# Rationale: H proved target_kl prevents entropy collapse but 0.015 throttled
#   96% of productive updates (natural KL median=0.031). 0.05 sits above G's
#   75th percentile (0.043), letting ~75% of normal updates through while still
#   catching catastrophic cascades (G's cliff collapse would produce KL >>0.10).
# SB3 cutoff = 1.5 * 0.05 = 0.075, which passes ~90% of G's natural updates.

env:
  game: "SuperMarioBros-1-1-v0"
  movement: "SIMPLE_MOVEMENT"
  frame_skip: 4
  frame_stack: 4
  obs_size: 84
  num_envs: 16

training:
  total_timesteps: 5000000
  lr: 0.00025
  n_steps: 1024
  batch_size: 512
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.05
  ent_coef_final: 0.03
  target_kl: 0.05

reward:
  forward_scale: 0.3
  death_penalty: -15.0
  flag_bonus: 200.0
  time_penalty: -0.1

eval:
  eval_freq: 100000
  n_eval_episodes: 10
  deterministic: true

seed: 42
device: "auto"
