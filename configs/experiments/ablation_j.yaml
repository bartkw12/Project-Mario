# Ablation J — Extended training 10M (resume from Ablation I at 5M)
# Changes vs ablation_i:
#   - total_timesteps: 5M → 10M
# Everything else identical to ablation_i.
# Rationale: I was still improving at 5M (mean_x_pos accelerating: +474/M in
#   4-5M range, entropy healthy at -0.57, no collapse). This is the same
#   extension strategy as F (which extended D), but with three protections
#   that F didn't have:
#   1. target_kl=0.05 prevents the cascade that killed F/G
#   2. EntropyScheduleCallback bug fixed (uses explicit total_timesteps)
#   3. EntropyCollapseDetector provides real-time diagnostics
# Expected: Learning continues past where G collapsed at 4.9M, flag_rate
#   climbs into the 20-50%+ range by 10M.

env:
  game: "SuperMarioBros-1-1-v0"
  movement: "SIMPLE_MOVEMENT"
  frame_skip: 4
  frame_stack: 4
  obs_size: 84
  num_envs: 16

training:
  total_timesteps: 10000000
  lr: 0.00025
  n_steps: 1024
  batch_size: 512
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.05
  ent_coef_final: 0.03
  target_kl: 0.05

reward:
  forward_scale: 0.3
  death_penalty: -15.0
  flag_bonus: 200.0
  time_penalty: -0.1

eval:
  eval_freq: 100000
  n_eval_episodes: 10
  deterministic: true

seed: 42
device: "auto"
