# Ablation H — target_kl stability test (Ablation G + target_kl)
# Changes vs ablation_g:
#   - target_kl: 0.015 (NEW — caps KL divergence per PPO update)
# Everything else identical to ablation_g (reward shaping + entropy schedule).
# Rationale: G achieved 36% peak flag rate but entropy cliff-collapsed at 4.9M.
#   The collapse is a cascade of oversized policy updates — clipping alone isn't
#   enough to prevent it. target_kl truncates the epoch loop within each update
#   when KL exceeds 1.5 * target_kl, breaking the positive feedback loop.
# Diagnostic: EntropyCollapseDetector runs in logging-only mode. Check
#   collapse/ metrics in TensorBoard to see if target_kl prevents the cliff.

env:
  game: "SuperMarioBros-1-1-v0"
  movement: "SIMPLE_MOVEMENT"
  frame_skip: 4
  frame_stack: 4
  obs_size: 84
  num_envs: 16

training:
  total_timesteps: 5000000
  lr: 0.00025
  n_steps: 1024
  batch_size: 512
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.05
  ent_coef_final: 0.03
  target_kl: 0.015

reward:
  forward_scale: 0.3
  death_penalty: -15.0
  flag_bonus: 200.0
  time_penalty: -0.1

eval:
  eval_freq: 100000
  n_eval_episodes: 10
  deterministic: true

seed: 42
device: "auto"
