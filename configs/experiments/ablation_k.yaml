# Ablation K — D-family extended to 10M with target_kl + higher entropy floor
# Base: Ablation D (forward_scale=0.3, ent_coef 0.05→0.02, flag_bonus=50)
# Changes vs D:
#   - total_timesteps: 5M → 10M (D was still climbing at 5M, hit 18% at 5.0M checkpoint)
#   - ent_coef_final: 0.02 → 0.03 (every run reaching 0.02 eventually eroded)
#   - target_kl: None → 0.05 (cascade protection proven in I/J, calibrated to env)
# Hypothesis: D's monotonic learning curve continues past 5M. Higher entropy
#   floor (0.03) slows the erosion that killed J after 8M. target_kl prevents
#   any cascade collapse. D's gentler reward structure (no time_penalty, flag_bonus=50)
#   avoids the gradient amplification that accelerated J's entropy erosion.
# Expected: Surpass J 8.0M's 26% stochastic flag rate with sustained stability.

env:
  game: "SuperMarioBros-1-1-v0"
  movement: "SIMPLE_MOVEMENT"
  frame_skip: 4
  frame_stack: 4
  obs_size: 84
  num_envs: 16

training:
  total_timesteps: 10000000
  lr: 0.00025
  n_steps: 1024
  batch_size: 512
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.05
  ent_coef_final: 0.03
  target_kl: 0.05

reward:
  forward_scale: 0.3
  death_penalty: -15.0
  flag_bonus: 50.0
  time_penalty: 0.0

eval:
  eval_freq: 100000
  n_eval_episodes: 10
  deterministic: true

seed: 42
device: "auto"
