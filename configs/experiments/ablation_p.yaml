# Ablation P — Resume O 14.5M with LR halved, dense checkpoints
# Base: Ablation O (L config + LR=3.125e-5, resumed from N 13.5M)
# Changes vs O:
#   - lr: 0.00003125 → 0.000015625 (halved again — 5th iteration of compounding strategy)
#   - total_timesteps: 16.5M (2M additional steps from 14.5M resume point)
#   - checkpoint_freq: 500K → 100K (dense checkpointing to capture golden window)
# Method: Resume from O 14.5M checkpoint (best stochastic model at 74%).
# Hypothesis: O peaked at 74% (14.5M) with training still showing upward trajectory.
#   Dense checkpointing ensures the true peak is captured within the golden window.
#   One more LR halving should push past 74% toward the 80% target.
# Expected: Cross or approach 80% stochastic flag capture.

env:
  game: "SuperMarioBros-1-1-v0"
  movement: "SIMPLE_MOVEMENT"
  frame_skip: 4
  frame_stack: 4
  obs_size: 84
  num_envs: 16

training:
  total_timesteps: 16500000
  lr: 0.000015625
  n_steps: 1024
  batch_size: 512
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.05
  ent_coef_final: 0.03
  target_kl: 0.05
  checkpoint_freq: 100000

reward:
  forward_scale: 0.3
  death_penalty: -15.0
  flag_bonus: 100.0
  time_penalty: -0.05

eval:
  eval_freq: 100000
  n_eval_episodes: 10
  deterministic: true

seed: 42
device: "auto"
