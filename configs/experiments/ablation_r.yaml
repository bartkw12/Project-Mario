# Ablation R — Resume O 14.5M with n_epochs=3 (isolated test)
# Base: Ablation O (L config + LR=3.125e-5, best checkpoint at 14.5M)
# Changes vs O:
#   - n_epochs: 4 → 3 (fewer gradient passes = less entropy drift per step)
#   - checkpoint_freq: 100K (dense checkpointing for fine-grained sweep)
#   - total_timesteps: 17.5M (3M additional steps from 14.5M resume point)
# CRITICAL: ent_coef_final stays at 0.03 (matching O) to avoid entropy discontinuity.
# Method: Resume from O 14.5M checkpoint.
# Hypothesis: Q could not test n_epochs=3 because the entropy discontinuity dominated.
#   With matching entropy parameters, this isolates whether fewer gradient passes per
#   batch extends the golden window by reducing per-step entropy erosion.
# Expected: Wider golden window → higher or sustained flag rate past 14.5M.

env:
  game: "SuperMarioBros-1-1-v0"
  movement: "SIMPLE_MOVEMENT"
  frame_skip: 4
  frame_stack: 4
  obs_size: 84
  num_envs: 16

training:
  total_timesteps: 17500000
  lr: 0.00003125
  n_steps: 1024
  batch_size: 512
  n_epochs: 3
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.05
  ent_coef_final: 0.03
  target_kl: 0.05
  checkpoint_freq: 100000

reward:
  forward_scale: 0.3
  death_penalty: -15.0
  flag_bonus: 100.0
  time_penalty: -0.05

eval:
  eval_freq: 100000
  n_eval_episodes: 10
  deterministic: true

seed: 42
device: "auto"
