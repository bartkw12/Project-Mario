# Ablation C — forward_scale 0.2 (2x baseline) + entropy schedule
# Change: forward_scale 0.1 → 0.2
# Base: entropy schedule (0.05 → 0.02) from ablation_ent_schedule
# Hypothesis: Slightly more urgency incentive without drowning death penalty.

env:
  game: "SuperMarioBros-1-1-v0"
  movement: "SIMPLE_MOVEMENT"
  frame_skip: 4
  frame_stack: 4
  obs_size: 84
  num_envs: 16

training:
  total_timesteps: 5000000
  lr: 0.00025
  n_steps: 1024
  batch_size: 512
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.05
  ent_coef_final: 0.02

reward:
  forward_scale: 0.2
  death_penalty: -15.0
  flag_bonus: 50.0

eval:
  eval_freq: 100000
  n_eval_episodes: 10
  deterministic: true

seed: 42
device: "auto"
